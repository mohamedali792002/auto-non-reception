<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - مركز أوتو نون</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --accent: #2563eb;
      --cyan: #38bdf8;
      --text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .login-box {
      background: var(--card-bg);
      padding: 40px 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(37, 99, 235, 0.2);
      border: 1px solid #1e293b;
      text-align: center;
      position: relative;
    }

    /* هيكل اللوجو المتحرك بالـ CSS */
    .logo-container {
      position: relative;
      width: 160px;
      height: 140px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* الترس خلف السيارة */
    .gear-icon {
      position: absolute;
      top: 0;
      font-size: 110px;
      color: #334155;
      transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s;
      z-index: 1;
    }

    /* صورة/أيقونة السيارة */
    .car-container {
      position: absolute;
      bottom: 10px;
      z-index: 2;
      width: 100%;
    }

    .car-icon {
      font-size: 70px;
      color: var(--cyan);
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.5));
    }

    /* انيميشن الكشافات (تأثير النور) */
    .headlights {
      position: absolute;
      bottom: 25px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 0 25px;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 3;
    }

    .light-beam {
      width: 15px;
      height: 15px;
      background: #60a5fa;
      border-radius: 50%;
      box-shadow: 0 0 20px 10px #60a5fa, 0 0 40px 20px #2563eb;
    }

    /* الفئات التي تُفعّل بالأنيميشن عند الضغط */
    .gear-spin {
      transform: rotate(360deg);
      color: var(--cyan) !important;
    }

    .headlights-flash {
      animation: flash 0.4s infinite alternate;
    }

    @keyframes flash {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    h1 { font-size: 1.8rem; margin-bottom: 5px; color: #fff; }
    p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }

    .input-group {
      margin-bottom: 18px;
      text-align: right;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    .input-group select, .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1.5px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .input-group select:focus, .input-group input:focus {
      border-color: var(--cyan);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      color: white;
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      transition: opacity 0.2s;
    }

    .btn-login:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="login-box">
    
    <!-- اللوجو التفاعلي -->
    <div class="logo-container">
      <i class="fa-solid fa-gear gear-icon" id="gear"></i>
      <div class="car-container">
        <i class="fa-solid fa-car-side car-icon" id="car"></i>
        <div class="headlights" id="headlights">
          <div class="light-beam"></div>
          <div class="light-beam"></div>
        </div>
      </div>
    </div>

    <h1>أوتو نون Auto Non</h1>
    <p class="subtitle">منظومة إدارة مراكز صيانة السيارات</p>

    <form onsubmit="handleLogin(event)">
      <div class="input-group">
        <label><i class="fa-solid fa-user-gear"></i> القسم / الحساب</label>
        <select id="userRole" required>
          <option value="">اختر القسم...</option>
          <option value="admin">المدير العام (Admin)</option>
          <option value="reception">الاستقبال (Reception)</option>
          <option value="mechanics">قسم الميكانيكا</option>
          <option value="chassis">قسم العفشة</option>
          <option value="electric">قسم الكهرباء</option>
          <option value="upholstery">قسم السروجي</option>
          <option value="tires">قسم الكاوتش</option>
        </select>
      </div>

      <div class="input-group">
        <label><i class="fa-solid fa-lock"></i> كلمة المرور</label>
        <input type="password" id="passCode" placeholder="أدخل كلمة المرور..." required>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        تسجيل الدخول <i class="fa-solid fa-arrow-left"></i>
      </button>
    </form>
  </div>

  <script>
    // كلمة سر موحدة للتجربة: 123456 (أو admin للمدير)
    const passwords = {
      admin: "admin",
      reception: "123456",
      mechanics: "123456",
      chassis: "123456",
      electric: "123456",
      upholstery: "123456",
      tires: "123456"
    };

    const targetPages = {
      admin: "admin.html",
      reception: "index.html",
      mechanics: "mechanics.html",
      chassis: "chassis.html",
      electric: "electric.html",
      upholstery: "upholstery.html",
      tires: "tires.html"
    };

    function handleLogin(e) {
      e.preventDefault();

      const role = document.getElementById('userRole').value;
      const pass = document.getElementById('passCode').value;

      if (passwords[role] && passwords[role] === pass) {
        
        // تشغيل أنيميشن اللوجو (دوران الترس وإضاءة النور)
        const gear = document.getElementById('gear');
        const headlights = document.getElementById('headlights');

        gear.classList.add('gear-spin');
        headlights.classList.add('headlights-flash');

        // حفظ بيانات الجلسة
        localStorage.setItem('autonon_user', JSON.stringify({ role: role, loggedIn: true }));

        // الانتظار 1.2 ثانية لاكتمال الحركة قبل الانتقال
        setTimeout(() => {
          window.location.href = targetPages[role];
        }, 1200);

      } else {
        alert("كلمة المرور غير صحيحة!");
      }
    }
  </script>
</body>
</html>
